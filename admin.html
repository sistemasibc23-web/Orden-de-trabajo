<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin — Control de Órdenes</title>
  <!-- Librería para generar y descargar archivos Excel de forma gratuita -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #0f172a;
      --accent: #2563eb;
      --border: #e2e8f0;
      --text: #1e293b;
      --danger: #dc2626;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }

    /* PANTALLA DE INICIO DE SESIÓN (LOGIN) */
    .login-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .login-card {
      background: var(--card);
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .login-card h2 {
      margin-top: 0;
      font-size: 1.3rem;
      color: var(--primary);
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 20px;
    }
    .login-form input {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }
    .error-message {
      color: var(--danger);
      font-size: 0.85rem;
      display: none;
      margin-top: 6px;
    }

    /* CONTENEDOR DEL DASHBOARD */
    .dashboard-container {
      display: none;
      padding: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-buttons {
      display: flex;
      gap: 10px;
    }
    .filters {
      background: var(--card);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      gap: 16px;
      align-items: flex-end;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
    }
    input[type="date"] {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
    }
    .btn {
      padding: 9px 16px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-excel { background: #16a34a; color: white; }
    .btn-excel:hover { background: #15803d; }
    .btn-logout { background: #64748b; color: white; }
    .btn-logout:hover { background: #475569; }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .stat-card h3 { margin: 0; font-size: 0.85rem; color: #64748b; text-transform: uppercase; }
    .stat-card .value { font-size: 1.8rem; font-weight: bold; margin-top: 8px; color: var(--primary); }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th { background: #f1f5f9; font-size: 0.8rem; text-transform: uppercase; color: #475569; }
  </style>
</head>
<body>

  <!-- VENTANA LOGIN -->
  <div class="login-modal" id="loginModal">
    <div class="login-card">
      <h2>🔒 Acceso Administrativo</h2>
      <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 0;">Ingrese credenciales de supervisor</p>
      
      <form class="login-form" id="loginForm">
        <input type="text" id="userInput" placeholder="Usuario" required autocomplete="off">
        <input type="password" id="passInput" placeholder="Contraseña" required>
        <button type="submit" class="btn btn-primary">Ingresar al Dashboard</button>
      </form>
      <div class="error-message" id="errorMessage">Usuario o contraseña incorrectos</div>
    </div>
  </div>

  <!-- PANEL DASHBOARD -->
  <div class="dashboard-container" id="dashboardContent">
    <div class="header">
      <h2>Dashboard de Administración — Taller</h2>
      <div class="header-buttons">
        <button class="btn btn-excel" onclick="exportarExcel()">📊 Descargar Reporte Excel</button>
        <button class="btn btn-logout" onclick="cerrarSesion()">Salir</button>
      </div>
    </div>

    <!-- FILTROS DE FECHA -->
    <div class="filters">
      <div class="filter-group">
        <label for="fechaInicio">Desde:</label>
        <input type="date" id="fechaInicio">
      </div>
      <div class="filter-group">
        <label for="fechaFin">Hasta:</label>
        <input type="date" id="fechaFin">
      </div>
      <button class="btn btn-primary" onclick="filtrarDatos()">Filtrar</button>
      <button class="btn btn-logout" onclick="limpiarFiltro()">Limpiar Filtro</button>
    </div>

    <!-- TARJETAS CON MÉTRICAS -->
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Órdenes</h3>
        <div class="value" id="totalOrdenes">0</div>
      </div>
      <div class="stat-card">
        <h3>Mecánicos Activos</h3>
        <div class="value" id="totalMecanicos">0</div>
      </div>
    </div>

    <!-- TABLA RESUMEN POR MECÁNICO -->
    <h3>Resumen de Trabajos por Mecánico</h3>
    <table>
      <thead>
        <tr>
          <th>Mecánico</th>
          <th>Total Órdenes Registradas</th>
        </tr>
      </thead>
      <tbody id="tablaMecanicos">
        <tr>
          <td colspan="2" style="text-align:center; color:#64748b;">Cargando información...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- SCRIPT DE CONTROL Y CONEXIÓN CON NETLIFY -->
  <script>
    // CREDENCIALES DE ACCESO AL DASHBOARD
    const ADMIN_USER = "admin";
    const ADMIN_PASS = "12345";

    // COLOCAR AQUÍ TUS CLAVES DE NETLIFY
    const NETLIFY_TOKEN = "nfp_g9LzhjrL6XgENuvwrp7UR1MFszSo1Dzh54b4";
    const NETLIFY_SITE_ID = "e3c1dc51-eba6-470e-b197-cbb93bb22b4a";

    let datosGlobales = [];

    // MANEJO DE LOGIN
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('userInput').value;
      const pass = document.getElementById('passInput').value;

      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('dashboardContent').style.display = 'block';
        sessionStorage.setItem('adminAutenticado', 'true');
        cargarDatosNetlify();
      } else {
        document.getElementById('errorMessage').style.display = 'block';
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('adminAutenticado') === 'true') {
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('dashboardContent').style.display = 'block';
        cargarDatosNetlify();
      }
    });

    function cerrarSesion() {
      sessionStorage.removeItem('adminAutenticado');
      location.reload();
    }

    // OBTENER REGISTROS DESDE API NETLIFY
    async function cargarDatosNetlify() {
      try {
        const formsResponse = await fetch(`https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/forms`, {
          headers: { Authorization: `Bearer ${NETLIFY_TOKEN}` }
        });
        const forms = await formsResponse.json();
        
        if (!forms || forms.length === 0) {
          document.getElementById('tablaMecanicos').innerHTML = '<tr><td colspan="2" style="text-align:center;">No hay formularios registrados en Netlify.</td></tr>';
          return;
        }

        const formId = forms[0].id;

        const subResponse = await fetch(`https://api.netlify.com/api/v1/forms/${formId}/submissions`, {
          headers: { Authorization: `Bearer ${NETLIFY_TOKEN}` }
        });
        const submissions = await subResponse.json();

        datosGlobales = submissions.map(sub => ({
          Fecha: new Date(sub.created_at).toLocaleDateString(),
          FechaRaw: new Date(sub.created_at),
          OT: sub.data.ordenTrabajo || 'N/A',
          Mecanico: sub.data.mecanico || 'Sin Asignar',
          Trabajo: sub.data.trabajoRealizar || '',
          Operacion: sub.data.operacion || '',
          MaquinaTaller: sub.data.maquinaTaller || '',
          CodMaq: sub.data.codMaq || '',
          CentroTrabajo: sub.data.centroTrabajo || '',
          MaquinaPlanta: sub.data.maquinaSolicitante || '',
          HoraInicio: sub.data.horaInicio || '',
          HoraFin: sub.data.horaFin || '',
          TotalTiempo: sub.data.totalTiempo || '',
          Observaciones: sub.data.observaciones || ''
        }));

        renderizarDashboard(datosGlobales);

      } catch (error) {
        console.error("Error al obtener datos:", error);
        document.getElementById('tablaMecanicos').innerHTML = '<tr><td colspan="2" style="text-align:center; color:red;">Error al cargar datos. Verifique sus credenciales de Netlify.</td></tr>';
      }
    }

    // MOSTRAR DATOS EN PANTALLA
    function renderizarDashboard(datos) {
      document.getElementById('totalOrdenes').innerText = datos.length;

      const conteoMecanicos = {};
      datos.forEach(d => {
        conteoMecanicos[d.Mecanico] = (conteoMecanicos[d.Mecanico] || 0) + 1;
      });

      document.getElementById('totalMecanicos').innerText = Object.keys(conteoMecanicos).length;

      const tbody = document.getElementById('tablaMecanicos');
      tbody.innerHTML = '';

      if (Object.keys(conteoMecanicos).length === 0) {
        tbody.innerHTML = '<tr><td colspan="2" style="text-align:center;">No hay registros en el rango seleccionado.</td></tr>';
        return;
      }

      Object.keys(conteoMecanicos).forEach(mecanico => {
        const fila = `<tr>
          <td>${mecanico}</td>
          <td><strong>${conteoMecanicos[mecanico]}</strong></td>
        </tr>`;
        tbody.innerHTML += fila;
      });
    }

    // FILTRADO POR RANGO DE FECHAS
    function filtrarDatos() {
      const desdeVal = document.getElementById('fechaInicio').value;
      const hastaVal = document.getElementById('fechaFin').value;

      if (!desdeVal || !hastaVal) {
        alert("Por favor seleccione fecha de inicio y fin.");
        return;
      }

      const desde = new Date(desdeVal + "T00:00:00");
      const hasta = new Date(hastaVal + "T23:59:59");

      const filtrados = datosGlobales.filter(d => d.FechaRaw >= desde && d.FechaRaw <= hasta);
      renderizarDashboard(filtrados);
    }

    function limpiarFiltro() {
      document.getElementById('fechaInicio').value = '';
      document.getElementById('fechaFin').value = '';
      renderizarDashboard(datosGlobales);
    }

    // DESCARGAR EXCEL COMPLETO
    function exportarExcel() {
      if (datosGlobales.length === 0) {
        alert("No hay registros disponibles para exportar.");
        return;
      }

      const datosExcel = datosGlobales.map(({ FechaRaw, ...resto }) => resto);

      const hoja = XLSX.utils.json_to_sheet(datosExcel);
      const libro = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(libro, hoja, "Ordenes_Taller");

      XLSX.writeFile(libro, `Reporte_Ordenes_Taller_${new Date().toISOString().slice(0,10)}.xlsx`);
    }
  </script>

</body>
</html>
